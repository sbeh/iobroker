    <script>
        /**
         * Creates sliding windows from flat time series data
         * @param {Array} flatData - Array of {url, value} objects
         * @param {number} inputWindowSize - Size of input window
         * @param {number} labelWindowSize - Size of label window
         * @returns {Array} Array of {url, inputs, labels} objects
         */
        function createSlidingWindows(flatData, inputWindowSize, labelWindowSize) {
            const windowSize = inputWindowSize + labelWindowSize
            const result = []
            
            for (let i = 0; i <= flatData.length - windowSize; i++) {
                const inputs = []
                const labels = []
                
                // Extract input values
                for (let j = 0; j < inputWindowSize; j++) {
                    inputs.push(flatData[i + j].value)
                }
                
                // Extract label values
                for (let j = 0; j < labelWindowSize; j++) {
                    labels.push(flatData[i + inputWindowSize + j].value)
                }
                
                // Use the URL from the first element of the window
                result.push({
                    url: flatData[i].url,
                    inputs: inputs,
                    labels: labels
                })
            }
            
            return result
        }

        async function train(quick, modelname, getSampleWeights, getModel, inputWindowSize, labelWindowSize) {
            document.getElementById('run').disabled = true
            document.getElementById('progress').disabled = false

            const data = await (await fetch('http://192.168.178.120:5001/read', {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain'
                },
                body: `SELECT * FROM model_train('${modelname}', ${quick})`
            })).json()
            console.log(`${data.length} datasets loaded`)
            window.data = data

            // Detect data format and convert if necessary
            let processedData = data
            if (data.length > 0 && data[0].hasOwnProperty('value') && !data[0].hasOwnProperty('inputs')) {
                // New flat format - convert to sliding windows
                if (!inputWindowSize || !labelWindowSize) {
                    throw new Error('inputWindowSize and labelWindowSize are required for flat data format')
                }
                console.log(`Converting flat data to sliding windows (input: ${inputWindowSize}, label: ${labelWindowSize})`)
                processedData = createSlidingWindows(data, inputWindowSize, labelWindowSize)
                console.log(`${processedData.length} windows created from ${data.length} data points`)
            }

            const model = getModel(processedData[0].inputs.length, processedData[0].labels.length)
            window.model = model

            let tfvisOnEpochEnd
            if (typeof tfvis !== 'undefined') {
                tfvis.show.modelSummary({ name: 'Model Summary' }, model)
                tfvisOnEpochEnd = tfvis.show.fitCallbacks(
                    { name: 'Training Performance' },
                    ['loss', 'mse', 'acc'],
                    {
                        callbacks: ['onEpochEnd'],
                        zoomToFitAccuracy: true,
                        yAxisDomain: [0, 20],
                        height: 300,
                    }
                ).onEpochEnd
            }

            const sampleWeights = getSampleWeights(processedData[0].labels.length)
            const loss = (labels, predictions, weights_, reduction) =>
                tf.losses.meanSquaredError(labels, predictions, sampleWeights, reduction)
            model.compile({
                optimizer: tf.train.adamax(decay = 0.001),
                loss,
                metrics: ['mse', 'acc'],
            })
            console.log('model compiled')

            const inputs = tf.tensor(processedData.map(d => d.inputs))
            window.inputs = inputs
            const labels = tf.tensor(processedData.map(d => d.labels))
            window.labels = labels

            let onEpochEndRuns = false
            let timeLast = Date.now()
            let epochLast = 0
            const callbacks = {
                onTrainBegin: () => {
                    document.getElementById('stop').disabled = false
                    for (let j of ['epochs', 'loss', 'mse', 'acc'])
                        for (let i of ['_', 1, 5, 15])
                            document.getElementById(`${j}${i}`).value = ''
                },
                onEpochEnd: (epoch, logs) => {
                    if (!progressVisible)
                        return
                    if (onEpochEndRuns)
                        return
                    onEpochEndRuns = true
                    setTimeout(() => {
                        try {
                            if (tfvisOnEpochEnd) {
                                tfvisOnEpochEnd(epoch, logs)

                                const predictions = model.predict(inputs)
                                const mseP = tf.losses.meanSquaredError(labels, predictions, sampleWeights, tf.Reduction.NONE)
                                const mse = mseP.sum(1)
                                const mseMI = mse.argMax()
                                const mseMaxI = mseMI.dataSync()[0]
                                //const y = labels.slice(mseMaxI, 1)
                                const p = predictions.slice(mseMaxI, 1)

                                const iframe = document.getElementById('iframe')
                                if (!window.iframeBlocked && processedData[mseMaxI].url) {
                                    window.iframeBlocked = true
                                    setTimeout(() => {
                                        window.iframeBlocked = false
                                    }, 10000)
                                    iframe.src = processedData[mseMaxI].url
                                }

                                tfvis.render.scatterplot(
                                    { name: 'Inputs' },
                                    {
                                        values: processedData[mseMaxI].inputs.map((v, i) => ({ x: i, y: v })),
                                    },
                                    {
                                        xLabel: 'Time',
                                        yLabel: 'Value',
                                        height: 300
                                    }
                                )
                                tfvis.render.scatterplot(
                                    { name: 'Actual vs Prediction' },
                                    {
                                        values: [
                                            processedData[mseMaxI].labels.map((v, i) => ({ x: i, y: v })),
                                            Array.from(p.dataSync(), (v, i) => ({ x: i, y: v }))
                                        ], series: ['actual', 'predicted']
                                    },
                                    {
                                        xLabel: 'Time',
                                        yLabel: 'Value',
                                        height: 300
                                    }
                                )

                                p.dispose()
                                //y.dispose()
                                mseMI.dispose()
                                mse.dispose()
                                mseP.dispose()
                                predictions.dispose()
                            }

                            const timeNow = Date.now()
                            const timeDiffMilliseconds = timeNow - timeLast
                            if (timeDiffMilliseconds > 1000) {
                                document.getElementById('epoch').value = epoch

                                const timeDiffMinutes = timeDiffMilliseconds / 1000 / 60

                                const epochDiff = (epoch - epochLast) / timeDiffMinutes
                                epochLast = epoch

                                for (let j of ['epochs', 'loss', 'mse', 'acc'])
                                    for (let i of ['_', 1, 5, 15]) {
                                        let value = j == 'epochs' ? epochDiff : logs[j]
                                        const last = document.getElementById(`${j}${i}`).value
                                        if (i !== '_' && last !== '') {
                                            const weight = timeDiffMinutes / i
                                            value = (1 - weight) * last + weight * value
                                        }
                                        document.getElementById(`${j}${i}`).value = value
                                    }
                                timeLast = timeNow
                            }
                        } catch (e) {
                            console.error(e)
                        }
                        onEpochEndRuns = false
                    }, 0)
                },
                onTrainEnd: () => {
                    document.getElementById('stop').disabled = true
                },
            }
            // tf.callbacks.earlyStopping(), TODO does not work, maybe window wasn't in foreground?
            window.fitHistory = await model.fit(inputs, labels, {
                batchSize: quick ? 32 : 128,
                epochs: quick ? 10 : Number.MAX_VALUE,
                callbacks,
                validationSplit: 0.2,
                shuffle: true,
                // sampleWeight, Error: sample weight is not supported yet.
            })
            console.log('model trained')

            if (!quick) {
                await model.save(`localstorage://${modelname}`)
                await model.save(`http://192.168.178.120:5001/${modelname}/store`)
                console.log('model saved')
            }

            document.getElementById('run').disabled = false
            document.getElementById('progress').disabled = true
        }
