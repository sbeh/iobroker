    <script>
        /**
         * Creates sliding window tensors from flat time series data using GPU operations
         * Supports both array and compact object formats:
         * - Array format: [{url, value}, ...]
         * - Compact format: {baseUrl, url: [...], value: [...]}
         * 
         * @param {Array|Object} flatData - Flat time series data
         * @param {number} inputWindowSize - Size of input window
         * @param {number} labelWindowSize - Size of label window
         * @returns {Object} Object with inputs and labels tensors, plus metadata array
         */
        function createSlidingWindowTensors(flatData, inputWindowSize, labelWindowSize) {
            const windowSize = inputWindowSize + labelWindowSize
            
            // Handle both data formats
            let values, urls, baseUrl
            if (Array.isArray(flatData)) {
                // Old array format: [{url, value}, ...]
                values = flatData.map(d => d.value)
                urls = flatData.map(d => d.url)
                baseUrl = null
            } else {
                // New compact format: {baseUrl, url: [...], value: [...]}
                values = flatData.value
                urls = flatData.url
                baseUrl = flatData.baseUrl || ''
            }
            
            if (values.length < windowSize) {
                throw new Error(`Insufficient data: need at least ${windowSize} points, got ${values.length}`)
            }
            
            // Create sliding windows, skipping windows with NULL values
            const inputsArray = []
            const labelsArray = []
            const metadata = []
            
            for (let i = 0; i <= values.length - windowSize; i++) {
                // Check if window contains any NULL/undefined values
                let hasNull = false
                for (let j = 0; j < windowSize; j++) {
                    if (values[i + j] === null || values[i + j] === undefined) {
                        hasNull = true
                        break
                    }
                }
                
                // Skip windows with NULL values
                if (hasNull) {
                    continue
                }
                
                // Extract input and label values for this window
                const inputValues = values.slice(i, i + inputWindowSize)
                const labelValues = values.slice(i + inputWindowSize, i + windowSize)
                
                // Create tensors for this window
                inputsArray.push(tf.tensor1d(inputValues))
                labelsArray.push(tf.tensor1d(labelValues))
                
                // Store metadata
                const url = baseUrl ? baseUrl + urls[i] : urls[i]
                metadata.push({ url })
            }
            
            if (inputsArray.length === 0) {
                throw new Error('No valid windows found (all windows contain NULL values)')
            }
            
            // Stack all windows into 2D tensors [numWindows, windowSize]
            const inputs = tf.stack(inputsArray)
            const labels = tf.stack(labelsArray)
            
            // Clean up intermediate tensors
            inputsArray.forEach(t => t.dispose())
            labelsArray.forEach(t => t.dispose())
            
            console.log(`Created ${metadata.length} valid windows from ${values.length} data points (skipped ${values.length - windowSize + 1 - metadata.length} windows with NULL values)`)
            
            return { inputs, labels, metadata }
        }

        async function train(quick, modelname, getSampleWeights, getModel, inputWindowSize, labelWindowSize) {
            document.getElementById('run').disabled = true
            document.getElementById('progress').disabled = false

            const data = await (await fetch('http://192.168.178.120:5001/read', {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain'
                },
                body: `SELECT * FROM model_train('${modelname}', ${quick})`
            })).json()
            
            // Log data size based on format
            if (Array.isArray(data)) {
                console.log(`${data.length} datasets loaded`)
            } else if (data.value) {
                console.log(`${data.value.length} data points loaded (compact format)`)
            }
            window.data = data

            let inputs, labels, metadata
            
            // Detect data format and convert if necessary
            const isCompactFormat = !Array.isArray(data) && data.value !== undefined
            const isArrayFormat = Array.isArray(data) && data.length > 0 && 
                                   Object.prototype.hasOwnProperty.call(data[0], 'value') && 
                                   !Object.prototype.hasOwnProperty.call(data[0], 'inputs')
            
            if (isCompactFormat || isArrayFormat) {
                // New flat format (array or compact) - convert to sliding windows using tensor operations
                if (inputWindowSize === undefined || labelWindowSize === undefined) {
                    throw new Error('inputWindowSize and labelWindowSize are required for flat data format')
                }
                console.log(`Converting flat data to sliding windows using tensor operations (input: ${inputWindowSize}, label: ${labelWindowSize})`)
                const result = createSlidingWindowTensors(data, inputWindowSize, labelWindowSize)
                inputs = result.inputs
                labels = result.labels
                metadata = result.metadata
                console.log(`${metadata.length} windows created from data points using GPU operations`)
            } else if (Array.isArray(data) && data.length > 0) {
                // Old format - convert to tensors directly
                inputs = tf.tensor(data.map(d => d.inputs))
                labels = tf.tensor(data.map(d => d.labels))
                metadata = data.map(d => ({ url: d.url }))
            } else {
                throw new Error('No data available for training or unknown data format')
            }

            window.inputs = inputs
            window.labels = labels
            window.metadata = metadata

            const model = getModel(inputs.shape[1], labels.shape[1])
            window.model = model

            let tfvisOnEpochEnd
            if (typeof tfvis !== 'undefined') {
                tfvis.show.modelSummary({ name: 'Model Summary' }, model)
                tfvisOnEpochEnd = tfvis.show.fitCallbacks(
                    { name: 'Training Performance' },
                    ['loss', 'mse', 'acc'],
                    {
                        callbacks: ['onEpochEnd'],
                        zoomToFitAccuracy: true,
                        yAxisDomain: [0, 20],
                        height: 300,
                    }
                ).onEpochEnd
            }

            const sampleWeights = getSampleWeights(labels.shape[1])
            const loss = (labels, predictions, weights_, reduction) =>
                tf.losses.meanSquaredError(labels, predictions, sampleWeights, reduction)
            model.compile({
                optimizer: tf.train.adamax(decay = 0.001),
                loss,
                metrics: ['mse', 'acc'],
            })
            console.log('model compiled')


            let onEpochEndRuns = false
            let timeLast = Date.now()
            let epochLast = 0
            const callbacks = {
                onTrainBegin: () => {
                    document.getElementById('stop').disabled = false
                    for (let j of ['epochs', 'loss', 'mse', 'acc'])
                        for (let i of ['_', 1, 5, 15])
                            document.getElementById(`${j}${i}`).value = ''
                },
                onEpochEnd: (epoch, logs) => {
                    if (!progressVisible)
                        return
                    if (onEpochEndRuns)
                        return
                    onEpochEndRuns = true
                    setTimeout(() => {
                        try {
                            if (tfvisOnEpochEnd) {
                                tfvisOnEpochEnd(epoch, logs)

                                const predictions = model.predict(inputs)
                                const mseP = tf.losses.meanSquaredError(labels, predictions, sampleWeights, tf.Reduction.NONE)
                                const mse = mseP.sum(1)
                                const mseMI = mse.argMax()
                                const mseMaxI = mseMI.dataSync()[0]
                                
                                const iframe = document.getElementById('iframe')
                                if (!window.iframeBlocked && metadata[mseMaxI].url) {
                                    window.iframeBlocked = true
                                    setTimeout(() => {
                                        window.iframeBlocked = false
                                    }, 10000)
                                    iframe.src = metadata[mseMaxI].url
                                }

                                // Get the input and label tensors for the worst prediction
                                const inputSlice = inputs.slice([mseMaxI, 0], [1, -1]).squeeze()
                                const labelSlice = labels.slice([mseMaxI, 0], [1, -1]).squeeze()
                                const predictionSlice = predictions.slice([mseMaxI, 0], [1, -1]).squeeze()
                                
                                // Convert to arrays for visualization
                                const inputValues = Array.from(inputSlice.dataSync())
                                const labelValues = Array.from(labelSlice.dataSync())
                                const predictionValues = Array.from(predictionSlice.dataSync())

                                tfvis.render.scatterplot(
                                    { name: 'Inputs' },
                                    {
                                        values: inputValues.map((v, i) => ({ x: i, y: v })),
                                    },
                                    {
                                        xLabel: 'Time',
                                        yLabel: 'Value',
                                        height: 300
                                    }
                                )
                                tfvis.render.scatterplot(
                                    { name: 'Actual vs Prediction' },
                                    {
                                        values: [
                                            labelValues.map((v, i) => ({ x: i, y: v })),
                                            predictionValues.map((v, i) => ({ x: i, y: v }))
                                        ], series: ['actual', 'predicted']
                                    },
                                    {
                                        xLabel: 'Time',
                                        yLabel: 'Value',
                                        height: 300
                                    }
                                )

                                // Clean up tensors
                                inputSlice.dispose()
                                labelSlice.dispose()
                                predictionSlice.dispose()
                                mseP.dispose()
                                predictions.dispose()
                            }

                            const timeNow = Date.now()
                            const timeDiffMilliseconds = timeNow - timeLast
                            if (timeDiffMilliseconds > 1000) {
                                document.getElementById('epoch').value = epoch

                                const timeDiffMinutes = timeDiffMilliseconds / 1000 / 60

                                const epochDiff = (epoch - epochLast) / timeDiffMinutes
                                epochLast = epoch

                                for (let j of ['epochs', 'loss', 'mse', 'acc'])
                                    for (let i of ['_', 1, 5, 15]) {
                                        let value = j == 'epochs' ? epochDiff : logs[j]
                                        const last = document.getElementById(`${j}${i}`).value
                                        if (i !== '_' && last !== '') {
                                            const weight = timeDiffMinutes / i
                                            value = (1 - weight) * last + weight * value
                                        }
                                        document.getElementById(`${j}${i}`).value = value
                                    }
                                timeLast = timeNow
                            }
                        } catch (e) {
                            console.error(e)
                        }
                        onEpochEndRuns = false
                    }, 0)
                },
                onTrainEnd: () => {
                    document.getElementById('stop').disabled = true
                },
            }
            // tf.callbacks.earlyStopping(), TODO does not work, maybe window wasn't in foreground?
            window.fitHistory = await model.fit(inputs, labels, {
                batchSize: quick ? 32 : 128,
                epochs: quick ? 10 : Number.MAX_VALUE,
                callbacks,
                validationSplit: 0.2,
                shuffle: true,
                // sampleWeight, Error: sample weight is not supported yet.
            })
            console.log('model trained')

            if (!quick) {
                await model.save(`localstorage://${modelname}`)
                await model.save(`http://192.168.178.120:5001/${modelname}/store`)
                console.log('model saved')
            }

            document.getElementById('run').disabled = false
            document.getElementById('progress').disabled = true
        }
        let progressVisible = true
        async function progress() {
            progressVisible = !progressVisible
        }

            })).json()

            console.log('predictions written, deleted and inserted rows:', deleted, inserted)
        }
        async function bath_window(quick) {
            train(quick, 'bath_window3',
                noOfLabels => tf.fill([noOfLabels], 1),
                (noOfInputs, noOfLabels) => {
                    const model = tf.sequential()

                    model.add(tf.layers.dense({ inputShape: [noOfInputs], units: noOfInputs }))
                    //model.add(tf.layers.dense({ units: 4 * noOfInputs }))
                    //model.add(tf.layers.dense({ units: 3 * noOfInputs }))
                    //model.add(tf.layers.dense({ units: 3 * noOfInputs }))
                    model.add(tf.layers.dense({ units: 2 * noOfInputs }))
                    model.add(tf.layers.dense({ units: noOfLabels }))

                    //model.add(tf.layers.dense({ inputShape: [noOfInputs], units: noOfLabels }))
                    return model
                },
                48, // inputWindowSize
                48  // labelWindowSize
            )
        }

            bath_window(quick)
